name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
      - run: gofmt -l . | tee /dev/stderr | wc -l | grep -q '^0$'
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
