name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
      - run: gofmt -l . | tee /dev/stderr | wc -l | grep -q '^0$'
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Install protoc
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Verify generated code is current
        run: make proto && git diff --exit-code
