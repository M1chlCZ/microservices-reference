syntax = "proto3";

package inventory.v1;

option go_package = "github.com/m1chlcz/microservices-reference/api/inventory/v1;inventoryv1";

// Inventory reserves and releases stock for other services.
service Inventory {
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
}

// ReservationItem is one SKU and quantity.
message ReservationItem {
  string sku = 1;
  int32 quantity = 2;
}

// ReserveRequest reserves every item at once.
message ReserveRequest {
  repeated ReservationItem items = 1;
}

// ReserveResponse returns the reservation identifier.
message ReserveResponse {
  string reservation_id = 1;
}

// ReleaseRequest releases one reservation.
message ReleaseRequest {
  string reservation_id = 1;
}

// ReleaseResponse is empty on success.
message ReleaseResponse {}
