name: microservices-reference

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: .
      args:
        SERVICE: migrate
    environment:
      ORDERS_MIGRATOR_URL: postgres://orders_migrator:orders-migrator-dev@postgres:5432/orders_db
      INVENTORY_MIGRATOR_URL: postgres://inventory_migrator:inventory-migrator-dev@postgres:5432/inventory_db
      NOTIFICATIONS_MIGRATOR_URL: postgres://notifications_migrator:notifications-migrator-dev@postgres:5432/notifications_db
      IDENTITY_MIGRATOR_URL: postgres://identity_migrator:identity-migrator-dev@postgres:5432/identity_db
      CATALOG_MIGRATOR_URL: postgres://catalog_migrator:catalog-migrator-dev@postgres:5432/catalog_db
      PAYMENTS_MIGRATOR_URL: postgres://payments_migrator:payments-migrator-dev@postgres:5432/payments_db
      SHIPPING_MIGRATOR_URL: postgres://shipping_migrator:shipping-migrator-dev@postgres:5432/shipping_db
      INVOICING_MIGRATOR_URL: postgres://invoicing_migrator:invoicing-migrator-dev@postgres:5432/invoicing_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  orders:
    build:
      context: .
      args:
        SERVICE: orders
    environment:
      ORDERS_DATABASE_URL: postgres://orders_app:orders-app-dev@postgres:5432/orders_db
      ORDERS_ADDR: ":8081"
      ORDERS_GRPC_ADDR: ":9081"
      INVENTORY_GRPC: inventory:9082
      PAYMENTS_GRPC: payments:9086
      NOTIFICATIONS_GRPC: notifications:9083
      SHIPPING_GRPC: shipping:9087
      INVOICING_GRPC: invoicing:9088
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
      - "9081:9081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  inventory:
    build:
      context: .
      args:
        SERVICE: inventory
    environment:
      INVENTORY_DATABASE_URL: postgres://inventory_app:inventory-app-dev@postgres:5432/inventory_db
      INVENTORY_ADDR: ":8082"
      INVENTORY_GRPC_ADDR: ":9082"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8082:8082"
      - "9082:9082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  notifications:
    build:
      context: .
      args:
        SERVICE: notifications
    environment:
      NOTIFICATIONS_DATABASE_URL: postgres://notifications_app:notifications-app-dev@postgres:5432/notifications_db
      NOTIFICATIONS_ADDR: ":8083"
      NOTIFICATIONS_GRPC_ADDR: ":9083"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
      - "9083:9083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  identity:
    build:
      context: .
      args:
        SERVICE: identity
    environment:
      IDENTITY_DATABASE_URL: postgres://identity_app:identity-app-dev@postgres:5432/identity_db
      IDENTITY_ADDR: ":8084"
      IDENTITY_GRPC_ADDR: ":9084"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
      - "9084:9084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  catalog:
    build:
      context: .
      args:
        SERVICE: catalog
    environment:
      CATALOG_DATABASE_URL: postgres://catalog_app:catalog-app-dev@postgres:5432/catalog_db
      CATALOG_ADDR: ":8085"
      CATALOG_GRPC_ADDR: ":9085"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8085:8085"
      - "9085:9085"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  payments:
    build:
      context: .
      args:
        SERVICE: payments
    environment:
      PAYMENTS_DATABASE_URL: postgres://payments_app:payments-app-dev@postgres:5432/payments_db
      PAYMENTS_ADDR: ":8086"
      PAYMENTS_GRPC_ADDR: ":9086"
      ORDERS_GRPC: orders:9081
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8086:8086"
      - "9086:9086"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  shipping:
    build:
      context: .
      args:
        SERVICE: shipping
    environment:
      SHIPPING_DATABASE_URL: postgres://shipping_app:shipping-app-dev@postgres:5432/shipping_db
      SHIPPING_ADDR: ":8087"
      SHIPPING_GRPC_ADDR: ":9087"
      SHIPPING_CARRIER: generic
      NOTIFICATIONS_GRPC: notifications:9083
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8087:8087"
      - "9087:9087"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  invoicing:
    build:
      context: .
      args:
        SERVICE: invoicing
    environment:
      INVOICING_DATABASE_URL: postgres://invoicing_app:invoicing-app-dev@postgres:5432/invoicing_db
      INVOICING_ADDR: ":8088"
      INVOICING_GRPC_ADDR: ":9088"
      NOTIFICATIONS_GRPC: notifications:9083
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8088:8088"
      - "9088:9088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
