apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: GRPC_TLS_CA
            value: /etc/grpc-certs/ca.crt
          - name: GRPC_TLS_SERVER_CERT
            value: /etc/grpc-certs/server.crt
          - name: GRPC_TLS_SERVER_KEY
            value: /etc/grpc-certs/server.key
          - name: GRPC_TLS_CLIENT_CERT
            value: /etc/grpc-certs/client.crt
          - name: GRPC_TLS_CLIENT_KEY
            value: /etc/grpc-certs/client.key
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: grpc-certs
            mountPath: /etc/grpc-certs
            readOnly: true
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: grpc-certs
            secret:
              secretName: grpc-certs
