# Template only. Create the real secret with kubectl and never commit values.
#
#   kubectl -n microservices create secret generic microservices-secrets \
#     --from-literal=orders-database-url='postgres://orders_app:...@postgres-rw.microservices-data.svc:5432/orders_db' \
#     ...
#
# The database host points at the read-write service of the CloudNativePG
# cluster. The migrator URLs are used by the migrate job only.
apiVersion: v1
kind: Secret
metadata:
  name: microservices-secrets
type: Opaque
stringData:
  orders-database-url: postgres://orders_app:CHANGE_ME@postgres-rw.microservices-data.svc:5432/orders_db
  inventory-database-url: postgres://inventory_app:CHANGE_ME@postgres-rw.microservices-data.svc:5432/inventory_db
  notifications-database-url: postgres://notifications_app:CHANGE_ME@postgres-rw.microservices-data.svc:5432/notifications_db
  identity-database-url: postgres://identity_app:CHANGE_ME@postgres-rw.microservices-data.svc:5432/identity_db
  catalog-database-url: postgres://catalog_app:CHANGE_ME@postgres-rw.microservices-data.svc:5432/catalog_db
  payments-database-url: postgres://payments_app:CHANGE_ME@postgres-rw.microservices-data.svc:5432/payments_db
  shipping-database-url: postgres://shipping_app:CHANGE_ME@postgres-rw.microservices-data.svc:5432/shipping_db
  invoicing-database-url: postgres://invoicing_app:CHANGE_ME@postgres-rw.microservices-data.svc:5432/invoicing_db
  orders-migrator-url: postgres://orders_migrator:CHANGE_ME@postgres-rw.microservices-data.svc:5432/orders_db
  inventory-migrator-url: postgres://inventory_migrator:CHANGE_ME@postgres-rw.microservices-data.svc:5432/inventory_db
  notifications-migrator-url: postgres://notifications_migrator:CHANGE_ME@postgres-rw.microservices-data.svc:5432/notifications_db
  identity-migrator-url: postgres://identity_migrator:CHANGE_ME@postgres-rw.microservices-data.svc:5432/identity_db
  catalog-migrator-url: postgres://catalog_migrator:CHANGE_ME@postgres-rw.microservices-data.svc:5432/catalog_db
  payments-migrator-url: postgres://payments_migrator:CHANGE_ME@postgres-rw.microservices-data.svc:5432/payments_db
  shipping-migrator-url: postgres://shipping_migrator:CHANGE_ME@postgres-rw.microservices-data.svc:5432/shipping_db
  invoicing-migrator-url: postgres://invoicing_migrator:CHANGE_ME@postgres-rw.microservices-data.svc:5432/invoicing_db
  cloudflare-tunnel-token: CHANGE_ME
